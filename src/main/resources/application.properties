spring.application.name=LiveRoute
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Servicios de mapas de OpenStreetMap (gratis, sin API key)
# Servidores de Overpass, en orden: si uno falla o tarda demasiado se prueba el siguiente.
# Comprobados el 2026-11-16 con el truststore de Java. maps.mail.ru se descarta (Java rechaza
# su certificado); overpass.kumi.systems y overpass.private.coffee no respondían.
overpass.urls=https://overpass-api.de/api/interpreter,https://overpass.openstreetmap.fr/api/interpreter,https://lz4.overpass-api.de/api/interpreter
nominatim.url=https://nominatim.openstreetmap.org/reverse

# Orígenes que pueden llamar a la API desde el navegador (CORS), separados por comas.
# Por defecto solo el front end de desarrollo (Vite).
liveroute.cors.origenes=http://localhost:5173
